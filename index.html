<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>EB Doc</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet"><style>
:root{--navy:#1f3a68;--lt:#e6eefa;--bg:#fbfaf7;--card:#fff;--bg2:#f3ede4;--tx:#1b2433;--mu:#6b7686;--bd:#e3e8f0;--rd:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--navy:#7fa6e8;--lt:#1c2a44;--bg:#0f1624;--card:#17213a;--bg2:#1d2740;--tx:#eef2f9;--mu:#9aa6ba;--bd:#2a3654;color-scheme:dark}}
:root[data-theme=dark]{--navy:#7fa6e8;--lt:#1c2a44;--bg:#0f1624;--card:#17213a;--bg2:#1d2740;--tx:#eef2f9;--mu:#9aa6ba;--bd:#2a3654;color-scheme:dark}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{font-family:Tajawal,system-ui,sans-serif;background:#cfd8e6;color:var(--tx);display:flex;justify-content:center;align-items:center}
#app{width:100%;max-width:430px;height:100%;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}
@media(min-width:600px){#app{height:min(860px,96%);border-radius:38px;border:9px solid #101a2e;box-shadow:0 20px 60px #0005}}
.sc{flex:1;overflow-y:auto;padding:14px 16px 20px;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(8px)}}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}.hd h1{flex:1;font-size:20px;margin:0}
.ib{width:38px;height:38px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--navy);font-size:17px;cursor:pointer}
.bt{width:100%;padding:13px;border:0;border-radius:14px;background:var(--navy);color:#fff;font:700 15px Tajawal;cursor:pointer;margin:6px 0}
.bt.s{background:var(--lt);color:var(--navy)}.bt.d{background:var(--rd)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:12px;box-shadow:0 2px 8px #1f3a6812;margin-bottom:10px}
input,textarea,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:15px Tajawal;margin:4px 0 8px}
label{font-size:13px;color:var(--mu)}.err{color:var(--rd);font-size:13px;min-height:16px}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.t{background:var(--lt);border-radius:16px;padding:12px 4px;text-align:center;font-size:12px;cursor:pointer;border:0;color:var(--navy);font-weight:500}.t b{display:block;font-size:26px;margin-bottom:4px}
.it{cursor:pointer;text-align:center;padding:10px}.sw{height:84px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,var(--lt),var(--bg2))}
.ch{display:inline-block;padding:7px 13px;border-radius:20px;background:var(--lt);color:var(--navy);font-size:13px;margin:0 0 6px 6px;cursor:pointer;border:0;font-family:Tajawal}.ch.on{background:var(--navy);color:#fff}
.tb{display:flex;border-top:1px solid var(--bd);background:var(--card);padding:6px 4px;padding-bottom:max(6px,env(safe-area-inset-bottom,0px))}
.tb button{flex:1;border:0;background:0;color:var(--mu);font:11px Tajawal;cursor:pointer}.tb button.on{color:var(--navy);font-weight:700}.tb b{display:block;font-size:20px}
.row{display:flex;align-items:center;gap:10px;justify-content:space-between}.mu{color:var(--mu);font-size:13px}.tag{font-size:11px;background:var(--bg2);padding:2px 8px;border-radius:10px;color:var(--mu)}
.mo{position:absolute;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}.sh{background:var(--bg);width:100%;max-height:90%;overflow:auto;border-radius:24px 24px 0 0;padding:18px}
.toast{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);background:var(--navy);color:var(--bg);padding:10px 18px;border-radius:20px;z-index:20;font-size:14px}
.sw2{position:relative;width:46px;height:26px;background:var(--bd);border-radius:20px;border:0;cursor:pointer}.sw2.on{background:var(--navy)}.sw2:after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}.sw2.on:after{inset-inline-start:23px}
.bar{flex:1;background:var(--navy);border-radius:6px 6px 0 0;min-height:3px}.wl{text-align:center;padding-top:50px}.lg{font-size:80px}.note{font-size:12px;background:var(--bg2);border-radius:12px;padding:9px;color:var(--mu);margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:8px 4px;vertical-align:top;text-align:start}
.hh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.tl{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:112px;padding:12px 6px;border:0;border-radius:20px;background:var(--lt);color:var(--tx);font:500 12px/1.3 Tajawal;text-align:center;cursor:pointer}.ic{display:inline-flex;align-items:center;justify-content:center;width:46px;height:46px;border-radius:50%;background:var(--card);font-size:22px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}</style></head><body><div id="app"></div><script>

const REC=[{n:['وصفة الأفوكادو والزبادي','Avocado & yogurt recipe'],e:'🥑',g:[['نصف حبة أفوكادو ناضجة','Half a ripe avocado'],['3 ملاعق زبادي يوناني','3 tbsp Greek yogurt']],s:[['اهرس الأفوكادو حتى يصبح ناعمًا.','Mash the avocado until smooth.'],['أضف الزبادي وقلّب جيدًا.','Stir in the yogurt.'],['قدّمه باردًا، وعدّل القوام حسب توصية أخصائي التغذية.','Serve chilled; adjust texture as your dietitian advises.']]},{n:['هريس العدس والجزر','Lentil & carrot puree'],e:'🥘',g:[['عدس مطبوخ','Cooked lentils'],['جزر مسلوق','Boiled carrot']],s:[['اسلق الجزر حتى يلين.','Boil carrots until soft.'],['اهرسه مع العدس وقليل من ماء الطبخ.','Blend with lentils and a little cooking water.'],['عدّل القوام حسب توصية أخصائي التغذية.','Adjust texture as your dietitian advises.']]}];
const recSec=()=>`<h3>${b('وصفات خطوة بخطوة','Step-by-step recipes')}</h3>`+REC.map((r,i)=>`<div class="card row" onclick="A.go('rc',{i:${i}})" style="cursor:pointer"><span style="display:flex;align-items:center;gap:8px"><img src="${IMG['rec'+i]}" style="width:44px;height:44px;border-radius:10px;object-fit:cover">${nm(r.n)}</span>›</div>`).join('');
R.rc=p=>{const r=REC[p.i];return`${hd(nm(r.n))}<img src="${IMG['rec'+p.i]}" style="width:100%;height:170px;object-fit:cover;border-radius:18px;margin-bottom:10px"><div class=card><b>${b('المكونات','Ingredients')}</b>${r.g.map(x=>`<div>• ${nm(x)}</div>`).join('')}</div>${r.s.map((x,i)=>`<div class=card><b>${i+1}.</b> ${nm(x)}</div>`).join('')}<div class=note>${b('وصفة عامة تجريبية؛ القيم الغذائية تقديرية وليست بديلًا عن توصية المختص.','Demo recipe; nutrition values are estimates, not a substitute for specialist advice.')}</div>`};
const WS=[['🧼','اغسل يديك أو ارتدِ قفازات نظيفة','Wash hands or wear clean gloves'],['💧','نظّف الجرح بالطريقة التي أوصى بها مختصك','Clean the wound as your specialist advised'],['🫳','جفّف الجلد المحيط بلطف دون فرك','Pat surrounding skin dry gently'],['📏','اختر مقاسًا يغطي الجرح مع هامش من الجلد السليم','Pick a size that covers the wound plus a margin'],['🩹','ضع الضماد دون شدّ أو تمديد','Apply without stretching or pulling'],['📝','ثبّت عند الحاجة وسجّل تاريخ التغيير','Secure if needed and note the change date']],WR=[['ارفع حافة الضماد ببطء مع تثبيت الجلد المجاور بيدك الأخرى.','Lift an edge slowly while supporting nearby skin.'],['إذا التصق الضماد، بلّله بالمحلول الذي يوصي به مختصك قبل الإزالة.','If stuck, moisten with what your specialist recommends first.'],['لا تسحب بسرعة، وتخلّص من الضماد المستعمل بأمان.','Never pull quickly; dispose of used dressings safely.']];
R.wsteps=()=>`${hd(b('دليل الضمادات','Dressing guide'))}<h3>${b('طريقة التطبيق خطوة بخطوة','Application step by step')}</h3><div class=g2>${WS.map((w,i)=>`<div class=card style="text-align:center;margin:0"><div style="font-size:34px">${w[0]}</div><div class=mu><b>${i+1}</b> ${b(w[1],w[2])}</div></div>`).join('')}</div><h3>${b('احتياطات الإزالة','Removal precautions')}</h3>${WR.map(x=>`<div class=card>• ${nm(x)}</div>`).join('')}<div class=card style="border-color:var(--rd)"><b style="color:var(--rd)">⚠️ ${b('تحذيرات طبية هامة','Important medical warnings')}</b><div class=mu style="color:var(--tx)">${b('معلومات عامة تعليمية وليست بديلًا عن إرشادات الشركة المصنعة أو الفريق الطبي. راجع المختص عند الاحمرار أو الحرارة أو الإفرازات أو الألم الشديد.','General educational info — not a substitute for manufacturer or medical-team guidance. See a specialist for redness, warmth, discharge or severe pain.')}</div></div>`;
const fabSec=()=>`<h3>${b('دليل الأقمشة','Fabric guide')}</h3><div class=g>${['fab1','fx1','fx0'].map(id=>get('fab',id)).filter(Boolean).map(x=>card('fab',x)).join('')}</div>`;
const _cmp=R.compare;R.compare=()=>_cmp()+fabSec();
const LVL=r=>r<=3?[b('منخفض','Low'),'#3a9a4a']:r<=6?[b('متوسط','Medium'),'#d9a400']:[b('مرتفع','High'),'#9b1c2e'];
const dash=(l,d)=>{const[t,c]=LVL(l.r),w=Array.from({length:7},(_,i)=>S.logs[dAdd(d,-i)]).filter(Boolean),av=w.length?(w.reduce((a,x)=>a+x.r,0)/w.length).toFixed(1):'–';return`<div class=card><b>${b('مقياس تهيج الجلد اليومي (0-10)','Daily skin irritation scale (0-10)')}</b><div id=lv style="text-align:center;font-weight:700;color:${c}">${t}</div><div style="direction:ltr;position:relative;height:12px;border-radius:8px;background:linear-gradient(90deg,#3a9a4a 33%,#e6c200 33% 66%,#9b1c2e 66%);margin:12px 0"><div id=mk style="position:absolute;top:-4px;inset-inline-start:calc(${l.r*10}% - 10px);width:20px;height:20px;border-radius:50%;background:#fff;border:3px solid ${c}"></div></div><div class="row mu" style="direction:ltr"><span>0-3 ${b('منخفض','Low')}</span><span>4-6 ${b('متوسط','Medium')}</span><span>7-10 ${b('مرتفع','High')}</span></div><div class=mu style="text-align:center;margin-top:6px">${b('متوسط آخر 7 أيام','7-day average')}: <b>${av}</b></div></div><div class=g><div class="card t" style="margin:0"><b>🩹 ${l.w||0}</b>${b('جروح جديدة','New wounds')}</div><div class="card t" style="margin:0"><b>📈 ${l.r}</b>${b('شدة الألم/التهيج','Pain/irritation')}</div><div class="card t" style="margin:0"><b>😴 ${l.sl??5}</b>${b('جودة النوم /10','Sleep /10')}</div></div>`};
const warn=()=>`<div class=card style="border-color:var(--rd);margin-top:12px"><b style="color:var(--rd)">⚠️ ${b('تحذيرات واحتياطات هامة','Important cautions')}</b><div style="margin-top:6px">• ${b('تجنّب وضع الأشرطة اللاصقة على الجلد الهش مباشرة ما لم يوجّهك مختصك.','Avoid adhesive strips directly on fragile skin unless your specialist advises.')}</div><div>• ${b('قلّل مخاطر الاحتكاك بتجنّب الأقمشة الخشنة.','Reduce friction risk by avoiding rough fabrics.')}</div><div>• ${b('راجع المختص إذا ارتفع التهيج أو ظهرت علامات عدوى.','See a specialist if irritation rises or signs of infection appear.')}</div></div>`;
const recs=l=>`<h3>${b('مقترحات تجريبية لتوافق البشرة','Sample skin-compatibility picks')}</h3><div class=mu style="margin-bottom:8px">${l.r>=7?b('مستوى التهيج مرتفع — يُفضّل مراجعة مختصك قبل تجربة منتجات جديدة.','Irritation is high — check with your specialist before trying new products.'):b('اقتراحات عامة تجريبية وليست توصية طبية.','General demo suggestions, not medical advice.')}</div><div class=g>${[['skin','skin0'],['fab','fx1'],['wound','wnd0']].map(a=>get(a[0],a[1])).filter(Boolean).map(x=>card(x===null?'':(S.items.skin.includes(x)?'skin':S.items.fab.includes(x)?'fab':'wound'),x)).join('')}</div>`;
const NAVMAIN=tabs.map(t=>t[0]);
function render(){const[s,p]=stack[stack.length-1];document.documentElement.lang=lang;document.documentElement.dir=lang=='ar'?'rtl':'ltr';S.theme?document.documentElement.dataset.theme=S.theme:delete document.documentElement.dataset.theme;
const f=document.activeElement,fid=f&&f.id,pos=f&&f.selectionStart;
$('#app').innerHTML=`<div class=sc>${R[s](p||{})}</div>`+(NAVMAIN.includes(s)?`<div class=tb>${tabs.map(t=>`<button class="${t[0]==s?'on':''}" onclick="A.tab('${t[0]}')"><b>${t[1]}</b>${nm(t[2])}</button>`).join('')}</div>`:'');
if(s=='cat')A.rl(p.k);if(s=='search')A.sr();
const q=document.querySelector('.sc input[oninput]');if(V.keep&&q){q.focus();q.setSelectionRange(99,99);V.keep=0}else if(fid&&$('#'+fid)){$('#'+fid).focus()}}
const A={go(s,p){V.q='';V.f='';stack.push([s,p]);render()},tab(s){stack=[[s]];V.q='';V.sq='';render()},back(){if(stack.length>1)stack.pop();render()},
lang(l){lang=S.lang=l;save();render()},theme(t){S.theme=t;save();render()},set(){},
open(k,id){const i=k+':'+id;S.hist=[i,...S.hist.filter(x=>x!=i)].slice(0,30);save();A.go('d',{k,id})},
rl(k){const l=list(k);$('#lst').innerHTML=l.length?l.map(x=>k=='skin'?srow(k,x):card(k,x)).join(''):empty()},
sr(){const q=(V.sq||'').toLowerCase().trim(),r=$('#res');if(!r)return;if(!q){r.innerHTML=empty(b('اكتب للبحث','Type to search'));return}const o=[];Object.keys(S.items).forEach(k=>S.items[k].forEach(x=>{if((nm(x.n)+(x.n+'')+(x.s||'')+(x.br||'')).toLowerCase().includes(q))o.push([k,x])}));r.innerHTML=o.length?`<div class=g2>${o.map(a=>card(a[0],a[1])).join('')}</div>`:empty()},
fav(i){S.fav=S.fav.includes(i)?S.fav.filter(x=>x!=i):[...S.fav,i];save();render();toast(b('تم التحديث','Updated'))},
cmp(i){S.cmp=S.cmp.includes(i)?S.cmp.filter(x=>x!=i):[...S.cmp,i];save();render();toast(b('تم التحديث','Updated'));if(S.cmp.length>1)toast(b('افتح المقارنة من الرئيسية','Open Compare from Home'))},
conf(m,fn){A._c=fn;M(`<p><b>${m}</b></p><button class="bt d" onclick="M();A._c()">${b('تأكيد','Confirm')}</button><button class="bt s" onclick="M()">${b('إلغاء','Cancel')}</button>`)},
login(){const e=$('#em').value.trim(),p=$('#pw').value;V.em=e;if(!/^\S+@\S+\.\S+$/.test(e))return $('#er').textContent=b('بريد إلكتروني غير صالح','Invalid email');if(p.length<6)return $('#er').textContent=b('كلمة المرور 6 أحرف على الأقل','Password needs 6+ chars');S.auth=1;if(!S.user.email||S.user.email=='hala@example.com')S.user.email=e;save();stack=[['home']];render()},
signup(){const n=$('#nn').value.trim(),e=$('#em').value.trim(),p=$('#pw').value,er=m=>$('#er').textContent=m;if(!n)return er(b('الاسم مطلوب','Name required'));if(!/^\S+@\S+\.\S+$/.test(e))return er(b('بريد غير صالح','Invalid email'));if(p.length<6)return er(b('6 أحرف على الأقل','6+ chars'));if(p!=$('#p2').value)return er(b('كلمتا المرور غير متطابقتين','Passwords differ'));S.user={name:n,email:e,av:'🙂'};S.auth=1;save();stack=[['home']];render();toast(b('تم إنشاء الحساب (محليًا)','Account created (local)'))},
forgot(){const e=$('#em').value.trim();if(!/^\S+@\S+\.\S+$/.test(e))return $('#er').textContent=b('بريد غير صالح','Invalid email');$('#er').style.color='var(--navy)';$('#er').textContent=b('تجريبي: لم يُرسل أي بريد فعلي — يتطلب ربط خدمة خلفية.','Demo: no email was sent — needs a backend.')},
form(k,id){const x=id?get(k,id):{},L=C[k].l;M(`<h3>${id?b('تعديل','Edit'):b('إضافة','Add')} — ${nm(C[k].t)}</h3>${FD[k].split(',').map(f=>{const lb=f=='p'?L[0]:f=='h'?L[1]:f=='w'?L[2]:FL[f];const lt=nm(lb);const mu='ihpw'.includes(f);return`<label>${lt}</label>${mu?`<textarea id=f_${f} rows=2>${esc(x[f])}</textarea>`:`<input id=f_${f} ${'kprcf'.includes(f)&&f.length<3&&f!='s'&&f!='n'?'type=number step=any':''} value="${esc(x[f])}">`}`}).join('')}<div class=err id=fe></div><button class=bt onclick="A.saveItem('${k}','${id||''}')">${b('حفظ','Save')}</button>`)},
saveItem(k,id){const g=f=>$('#f_'+f)?.value.trim(),n=g('n');if(!n)return $('#fe').textContent=b('الاسم مطلوب','Name is required');const o={};FD[k].split(',').forEach(f=>{o[f]=g(f);if('kprcf'.includes(f)&&['k','pr','c','f'].includes(f))o[f]=o[f]===''?null:+o[f]});if(id){Object.assign(get(k,id),o)}else S.items[k].unshift({id:'u'+Date.now(),e:C[k].ic,demo:0,...o});save();M();render();toast(b('تم الحفظ','Saved'))},
del(k,id){A.conf(b('حذف هذا العنصر؟','Delete this item?'),()=>{S.items[k]=S.items[k].filter(x=>x.id!=id);const i=k+':'+id;S.fav=S.fav.filter(x=>x!=i);S.cmp=S.cmp.filter(x=>x!=i);S.hist=S.hist.filter(x=>x!=i);save();stack.pop();render();toast(b('تم الحذف','Deleted'))})},
addCheck(){const v=$('#nc').value.trim();if(!v)return;A.keepDay();S.checks.push(v);save();render()},rmCheck(i){A.keepDay();S.checks.splice(i,1);Object.values(S.logs).forEach(l=>l.c=l.c.filter(x=>x!=i).map(x=>x>i?x-1:x));save();render()},
mk(v){v=+v;const L=LVL(v),m=$('#mk'),e=$('#lv');if(!m)return;m.style.insetInlineStart='calc('+v*10+'% - 10px)';m.style.borderColor=L[1];e.textContent=L[0];e.style.color=L[1]},keepDay(){const d=V.date||tdy();S.logs[d]=A.day()},day(){return{w:Math.max(0,+$('#nw').value||0),sl:+$('#sl').value,r:+$('#rg').value,n:$('#nt').value,c:[...document.querySelectorAll('.ck')].filter(c=>c.checked).map(c=>+c.dataset.i)}},
saveDay(){const d=$('#dt').value||tdy();S.logs[d]=A.day();save();render();toast(b('تم حفظ اليوم','Day saved'))},delDay(d){A.conf(b('حذف السجل؟','Delete entry?'),()=>{delete S.logs[d];save();render()})},
addQ(i){const v=$('#qn').value.trim();if(!v)return;(S.qs[i]=S.qs[i]||[]).push(v);save();render()},delQ(i,j){S.qs[i].splice(j,1);save();render()},
alertForm(id){const a=S.alerts.find(x=>x.id==id)||{t:'',d:tdy()+'T09:00'};M(`<h3>${b('تنبيه','Alert')}</h3><label>${b('العنوان *','Title *')}</label><input id=at value="${esc(a.t)}"><label>${b('الموعد','When')}</label><input id=ad type=datetime-local value="${a.d}"><div class=err id=fe></div><button class=bt onclick="A.saveAl('${id||''}')">${b('حفظ','Save')}</button>`)},
saveAl(id){const t=$('#at').value.trim(),d=$('#ad').value;if(!t||!d)return $('#fe').textContent=b('العنوان والموعد مطلوبان','Title and time required');if(id)Object.assign(S.alerts.find(x=>x.id==id),{t,d});else S.alerts.push({id:'a'+Date.now(),t,d,on:1});save();M();render()},
togAl(id){const a=S.alerts.find(x=>x.id==id);a.on=+!a.on;save();render()},delAl(id){A.conf(b('حذف التنبيه؟','Delete alert?'),()=>{S.alerts=S.alerts.filter(x=>x.id!=id);save();render()})},
editProfile(){M(`<h3>${b('تعديل الملف','Edit profile')}</h3><label>${b('الاسم','Name')}</label><input id=pn value="${esc(S.user.name)}"><label>${b('البريد','Email')}</label><input id=pe value="${esc(S.user.email)}"><label>${b('الصورة الرمزية','Avatar')}</label><div>${['👩','👨','🧒','🙂','🦋'].map(a=>`<button class="ch ${S.user.av==a?'on':''}" onclick="S.user.av='${a}';A.editProfile()">${a}</button>`).join('')}</div><div class=err id=fe></div><button class=bt onclick="A.saveProf()">${b('حفظ','Save')}</button>`)},
saveProf(){const n=$('#pn').value.trim(),e=$('#pe').value.trim();if(!n||!/^\S+@\S+\.\S+$/.test(e))return $('#fe').textContent=b('اسم وبريد صالحان مطلوبان','Valid name and email required');S.user.name=n;S.user.email=e;save();M();render()}};
render();
</script></body></html>
