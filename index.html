<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EB Doc - دليلك للاهتمام بالبشرة الهشة</title>
    <style>
        * {
            box-sizing: border-box;
            border-radius: 0px; /* زوايا حادة تماماً */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Tahoma, sans-serif;
        }
        body {
            /* خلفية طبية مهدئة بنمط رمادي سائل ناعم Medical Slate */
            background-color: #f4f7f6;
            color: #2c3e50;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            width: 100%;
            max-width: 420px;
            background: #ffffff;
            border: 2px solid #00a896; /* أزرق تيل طبي ناصع Medical Teal */
            padding: 35px 30px;
            box-shadow: 0 4px 20px rgba(0, 168, 150, 0.08);
        }
        h2 {
            color: #028090; /* أزرق طبي عميق */
            text-align: center;
            margin-top: 0;
            font-size: 21px;
            font-weight: 700;
        }
        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 13px;
            margin-bottom: 25px;
        }
        label {
            display: block;
            margin-top: 16px;
            font-size: 13px;
            color: #028090;
            font-weight: 600;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #00a896;
            background-color: #f8fbfb;
            font-size: 15px;
            color: #2c3e50;
            outline: none;
        }
        input:focus {
            background-color: #ffffff;
            border-color: #028090;
        }
        .btn-login {
            width: 100%;
            padding: 13px;
            margin-top: 25px;
            background-color: #028090; /* أزرق طبي علاج للزر الرئيسي */
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            display: block;
            text-align: center;
            transition: background 0.2s;
        }
        .btn-login:hover, .btn-login:active {
            background-color: #05668d;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            margin-top: 12px;
            background-color: #ffffff;
            color: #028090;
            border: 1px solid #028090;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-register:hover {
            background-color: #f0f7f7;
        }
        /* الشاشة الثانية */
        #dashboardScreen {
            display: none;
        }
        .medical-notice {
            background-color: #e0f2f1;
            border-right: 4px solid #00a896;
            padding: 12px 15px;
            color: #004d40;
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <!-- الشاشة الأولى: تسجيل الدخول -->
    <div class="card" id="loginScreen">
        <h2>دليلك للاهتمام بالبشرة الهشة</h2>
        <div class="subtitle">تطبيق يهتم باحتياجات أبطال البشرة الهشة EB</div>

        <form id="loginForm" onsubmit="event.preventDefault(); navigateToDashboard();">
            <label>اسم المستخدم أو البريد:</label>
            <input type="text" id="userInput" value="حلا وليد" required>

            <label>كلمة المرور:</label>
            <input type="password" id="passInput" value="•••••" required>

            <button type="submit" class="btn-login">تسجيل الدخول ←</button>
            <button type="button" class="btn-register" onclick="alert('صفحة إنشاء حساب جديد قيد التطوير')">👤+ إنشاء حساب جديد</button>
        </form>
    </div>

    <!-- الشاشة الثانية: الرئيسية بعد الضغط -->
    <div class="card" id="dashboardScreen">
        <h2>لوحة العناية الطبية - EB Doc</h2>
        <div class="medical-notice">أهلاً بكِ حلا! تم الدخول إلى النظام الطبي الجاهز.</div>
        
        <p style="font-size: 14px; color: #555;">اختر الخيار المطلوب للبدء:</p>
        
        <button class="btn-login" style="margin-top:10px;" onclick="alert('جاري فتح دليل العناية بالضمادات والترطيب...')">🩺 دليل العناية والضمادات اليومية</button>
        <button class="btn-login" style="margin-top:10px; background-color:#00a896;" onclick="alert('جاري فتح نموذج تقييم حالة البشرة...')">📋 تقييم حالة البشرة الهشة</button>
        
        <button class="btn-register" style="margin-top:25px;" onclick="location.reload()">تسجيل الخروج</button>
    </div>

    <script>
        function navigateToDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
        }
    </script>

</body>
</html>
