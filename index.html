(function () {

      var btn = 'display:block;width:100%;min-height:50px;margin:0 0 10px;border:0;border-radius:14px;font:700 16px Tahoma,Arial,sans-serif;cursor:pointer;';
      d.innerHTML = '<h2 style="margin:0 0 8px;font-size:22px">تعذّر تشغيل My Pet Care</h2>' +

        '<button id="mpc-reload" style="' + btn + 'background:#C9547F;color:#fff">إعادة تحميل الصفحة</button>' +
        '<button id="mpc-clear" style="' + btn + 'background:#F9D5DF;color:#6B1D3F">مسح البيانات المحفوظة وإعادة التشغيل</button>' +

     document.head.appendChild(l);

<style>
/* Layout: one fixed phone-sized column (top bar, scrolling screen, bottom bar), centered on wide screens. */
:root {
  --bg: #FDEFF2;
  --paper: #FFFAF8;
  --ink: #6B1D3F;
  --ink-soft: #8A4A63;
  --pink: #F9D5DF;
  --pink-line: #F2B9CA;
  --btn: #C9547F;
  --btn-press: #B0446C;
  --lav: #E7E0F8;
  --lav-d: #9886DB;
  --blue: #DAEDFB;
  --blue-d: #6FAEE6;
  --green: #DDF1D6;
  --green-d: #6FB45E;
  --peach: #FDE6D2;
  --peach-d: #E9A06A;
  --ok: #2F9E62;
  --danger: #B3263E;
  --stage: #F6D9E1;
  --font-ar: "Cairo", "Segoe UI", Tahoma, "Geeza Pro", "Noto Sans Arabic", "Noto Naskh Arabic", system-ui, -apple-system, sans-serif;
  --font-brand: "Fraunces", Georgia, "Times New Roman", serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--stage);
  color: var(--ink);
  font-family: var(--font-ar);
  font-size: 16px;
  line-height: 1.5;
  overflow: hidden;
}
button, input { font-family: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--lav-d); outline-offset: 2px; }

#shell {
  position: relative;
  height: 100%;
  max-width: 480px;
  margin-left: auto;
  margin-right: auto;
  margin-inline: auto;
  background-color: var(--bg);
  background-size: 140px 140px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 0 1px var(--pink-line), 0 10px 40px rgba(107, 29, 63, .12);
}
#screen { display: flex; flex-direction: column; flex: 1; min-height: 0; animation: fade .25s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* top bar */
.top {
  flex: none;
  display: grid;
  grid-template-columns: 44px 1fr 44px;
  align-items: center;
  gap: 8px;
  padding: 12px 16px 8px;
}
.top h1 { margin: 0; font-size: 20px; font-weight: 800; text-align: center; text-wrap: balance; }
.icon-btn {
  width: 44px; height: 44px; border-radius: 14px; border: 1.5px solid var(--pink-line);
  background: var(--paper); color: var(--ink); display: grid; place-items: center; padding: 0;
}
.icon-btn:active { background: var(--pink); }
.steps { display: flex; gap: 6px; padding: 0 20px 6px; align-items: end; }
.steps i { flex: 1; height: 6px; border-radius: 6px; background: var(--pink-line); opacity: .55; }
.steps i.on { opacity: 1; }
.steps i.cur { height: 9px; }
.step-label { text-align: center; font-size: 13px; color: var(--ink-soft); margin: 2px 0 6px; }

main { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 8px 18px 20px; -webkit-overflow-scrolling: touch; }
.bar { flex: none; padding: 10px 18px 14px; background: linear-gradient(to top, var(--bg) 70%, transparent); display: flex; flex-direction: column; gap: 8px; }
.msg { margin: 0; min-height: 0; text-align: center; font-size: 14px; font-weight: 600; color: var(--danger); }
.msg:empty { display: none; }
.msg.shake { animation: shake .35s; }
@keyframes shake { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }

/* buttons */
.btn {
  width: 100%; min-height: 52px; border: 0; border-radius: 16px; padding: 10px 18px;
  background: var(--btn); color: #fff; font-size: 17px; font-weight: 700;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 4px 0 var(--btn-press);
}
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--btn-press); }
.btn.ghost { background: var(--pink); color: var(--ink); box-shadow: 0 4px 0 var(--pink-line); }
 .btn.ghost:active { box-shadow: 0 2px 0 var(--pink-line); }
.btn.danger { background: #fff; color: var(--danger); border: 1.5px solid #E9B3BD; box-shadow: none; }
.btn.small { min-height: 44px; font-size: 15px; width: auto; }
.link { background: none; border: 0; color: var(--btn-press); font-weight: 700; font-size: 15px; padding: 8px 6px; text-decoration: underline; text-underline-offset: 3px; }

/* cards */
.card { background: var(--paper); border: 1.5px solid var(--pink-line); border-radius: 22px; padding: 14px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.note {
  display: flex; gap: 10px; align-items: flex-start; font-size: 13.5px; line-height: 1.55;
  background: var(--lav); border-radius: 16px; padding: 10px 12px; color: var(--ink);
}
.note svg { flex: none; margin-top: 2px; color: var(--lav-d); }
.note.green { background: var(--green); }
.note.green svg { color: var(--green-d); }

/* login */
.hero-art { position: relative; height: 150px; display: flex; justify-content: center; align-items: flex-end; margin-top: 4px; }
.hero-art .a { width: 112px; height: 112px; }
.hero-art .a.cat { margin-right: -22px; margin-inline-start: -22px; transform: translateY(6px); }
.hero-art .heart { position: absolute; top: 6px; left: 24%; inset-inline-end: 24%; color: var(--btn); }
.brand { text-align: center; margin: 2px 0 2px; }
.brand b { display: inline-flex; align-items: center; gap: 8px; font-family: var(--font-brand); font-size: 38px; line-height: 1.1; color: var(--ink); direction: ltr; }
.brand b svg { color: var(--btn); }
.brand p { margin: 2px 0 0; color: var(--ink-soft); font-size: 15px; font-weight: 600; }
.field { position: relative; }
.field input {
  width: 100%; height: 54px; padding: 0 48px; border-radius: 16px; border: 1.5px solid var(--pink-line);
  background: var(--paper); color: var(--ink); font-size: 16px; text-align: start;
}
.field input::placeholder { color: #B58497; }
.field .lead { position: absolute; right: 14px; inset-inline-start: 14px; top: 15px; color: var(--btn); pointer-events: none; }
.field .trail { position: absolute; left: 4px; inset-inline-end: 4px; top: 5px; width: 44px; height: 44px; border: 0; background: none; color: var(--ink-soft); display: grid; place-items: center; }
.field input:focus { border-color: var(--btn); outline: none; box-shadow: 0 0 0 3px var(--pink); }
.field.has-trail input { padding-left: 50px; padding-inline-end: 50px; }
.form-links { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 2px 6px; font-size: 15px; color: var(--ink-soft); }
.chip { display: inline-flex; align-items: center; gap: 6px; background: var(--blue); color: var(--ink); border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 600; }
.chip.pink { background: var(--pink); }
.chip.green { background: var(--green); }
.chip.lav { background: var(--lav); }
.chip.peach { background: var(--peach); }
.chip.red { background: #F9DADF; color: var(--danger); }

/* pets */
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.pet {
  position: relative; border-radius: 24px; border: 2px solid var(--pink-line); background: var(--paper); color: var(--ink);
  padding: 16px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 18px; font-weight: 700;
  transition: transform .15s, background .15s, border-color .15s;
}
.pet .a { width: 92px; height: 92px; }
.pet .tick { position: absolute; top: 10px; right: 10px; inset-inline-start: 10px; width: 28px; height: 28px; border-radius: 50%; background: var(--c-d); color: #fff; display: none; place-items: center; }
.pet[aria-pressed="true"] { background: var(--c); border-color: var(--c-d); transform: scale(1.03); box-shadow: 0 6px 0 var(--c-d); }
.pet[aria-pressed="true"] .tick { display: grid; }
.t-lav { --c: var(--lav); --c-d: var(--lav-d); }
.t-blue { --c: var(--blue); --c-d: var(--blue-d); }
.t-green { --c: var(--green); --c-d: var(--green-d); }
.t-peach { --c: var(--peach); --c-d: var(--peach-d); }
 /* vets */
.vet {
  width: 100%; text-align: start; display: grid; grid-template-columns: 60px 1fr 28px; gap: 12px; align-items: center;
  background: var(--paper); border: 2px solid var(--pink-line); border-radius: 22px; padding: 12px; color: var(--ink);
}
.vet .av { width: 60px; height: 60px; border-radius: 50%; overflow: hidden; }
.vet h3 { margin: 0; font-size: 17px; font-weight: 800; }
.vet .sub { margin: 0; font-size: 13.5px; color: var(--ink-soft); }
.vet .clinic { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 600; margin-top: 2px; }
.vet .clinic svg { color: var(--btn); flex: none; }
.vet .radio { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--pink-line); display: grid; place-items: center; color: transparent; }
.vet[aria-pressed="true"] { background: var(--blue); border-color: var(--blue-d); box-shadow: 0 5px 0 var(--blue-d); }
.vet[aria-pressed="true"] .radio { background: var(--blue-d); border-color: var(--blue-d); color: #fff; }

/* date and time */
.sec-title { display: flex; align-items: center; gap: 8px; margin: 14px 2px 8px; font-size: 16px; font-weight: 800; }
.sec-title svg { color: var(--btn); }
.dates { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.day {
  border-radius: 16px; border: 1.5px solid var(--pink-line); background: var(--paper); color: var(--ink);
  padding: 8px 2px; display: flex; flex-direction: column; align-items: center; gap: 0; min-height: 84px; justify-content: center;
}
.day small { font-size: 12.5px; color: var(--ink-soft); line-height: 1.3; }
.day strong { font-size: 24px; line-height: 1.2; font-variant-numeric: tabular-nums; }
.day em { font-style: normal; font-size: 11px; font-weight: 700; color: var(--btn-press); }
.day[aria-pressed="true"] { background: var(--pink); border-color: var(--btn); box-shadow: 0 4px 0 var(--btn); }
.slots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.slot {
  min-height: 48px; border-radius: 14px; border: 1.5px solid var(--blue-d); background: var(--blue); color: var(--ink);
  font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums;
}
.slot[aria-pressed="true"] { background: var(--btn); border-color: var(--btn); color: #fff; box-shadow: 0 4px 0 var(--btn-press); }
.slot[disabled] { background: #F3EAED; border-color: #E6D6DC; color: #A98E98; text-decoration: line-through; cursor: not-allowed; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12.5px; color: var(--ink-soft); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 14px; border-radius: 5px; border: 1.5px solid; display: inline-block; }

/* summary rows */
.rows { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; gap: 10px; padding: 12px 2px; border-bottom: 1px dashed var(--pink-line); min-height: 52px; }
.row:last-child { border-bottom: 0; }
.row .ic { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; background: var(--pink); color: var(--btn-press); flex: none; }
.row .k { color: var(--ink-soft); font-size: 14px; font-weight: 600; white-space: nowrap; }
.row .v { margin-right: auto; margin-inline-start: auto; font-weight: 700; text-align: end; min-width: 0; overflow-wrap: anywhere; }
.row .edit { flex: none; border: 0; background: none; color: var(--btn-press); font-weight: 700; font-size: 13px; padding: 8px 4px; min-width: 44px; min-height: 44px; }
.price-row .v { font-size: 22px; color: var(--btn-press); }

/* done */
.done { text-align: center; }
.check { width: 112px; height: 112px; border-radius: 50%; background: var(--ok); color: #fff; display: grid; place-items: center; margin: 8px auto 12px; box-shadow: 0 0 0 10px #D7F0E1; animation: pop .5s cubic-bezier(.2,1.4,.4,1); }
 @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: none; opacity: 1; } }
.done h2 { margin: 0; font-size: 24px; font-weight: 800; }
.refbox { display: inline-block; margin: 6px 0 14px; padding: 8px 28px; border-radius: 16px; background: var(--pink); font-size: 34px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: 2px; direction: ltr; }
.done .rows { text-align: start; }

/* home */
.hello { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 6px 0 12px; }
.hello h1 { margin: 0; font-size: 24px; font-weight: 800; line-height: 1.25; }
.hello p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.avatar-paw { width: 50px; height: 50px; border-radius: 50%; background: var(--pink); color: var(--btn); display: grid; place-items: center; flex: none; }
.banner { position: relative; overflow: hidden; border-radius: 26px; background: linear-gradient(135deg, #F9D5DF, #FDE6E0); border: 1.5px solid var(--pink-line); padding: 18px; min-height: 164px; }
.banner h2 { margin: 0 0 4px; font-size: 20px; font-weight: 800; max-width: 62%; line-height: 1.35; }
.banner p { margin: 0 0 12px; font-size: 13.5px; color: var(--ink-soft); max-width: 62%; }
.banner .pair { position: absolute; left: 6px; inset-inline-end: 6px; bottom: 6px; width: 40%; display: flex; align-items: flex-end; }
.banner .pair .a { width: 56%; }
.banner .pair .a + .a { margin-right: -14%; margin-inline-start: -14%; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tile { border: 0; border-radius: 22px; padding: 14px; text-align: start; color: var(--ink); display: flex; flex-direction: column; gap: 8px; min-height: 112px; }
.tile .ic { width: 40px; height: 40px; border-radius: 13px; background: rgba(255,255,255,.7); display: grid; place-items: center; }
.tile b { font-size: 16px; font-weight: 800; }
.tile span { font-size: 13px; color: var(--ink-soft); }
.tile.lav { background: var(--lav); }
.tile.blue { background: var(--blue); }

/* lists */
.seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--pink); border-radius: 16px; margin-bottom: 12px; }
.seg button { min-height: 42px; border: 0; background: transparent; border-radius: 12px; color: var(--ink); font-weight: 700; font-size: 14.5px; }
.seg button[aria-pressed="true"] { background: var(--paper); box-shadow: 0 1px 4px rgba(107,29,63,.15); }
.bk { width: 100%; display: grid; grid-template-columns: 54px 1fr 20px; gap: 12px; align-items: center; text-align: start; color: var(--ink); background: var(--paper); border: 1.5px solid var(--pink-line); border-radius: 20px; padding: 12px; }
.bk .pic { width: 54px; height: 54px; border-radius: 16px; background: var(--c); display: grid; place-items: center; }
.bk .pic .a { width: 44px; height: 44px; }
.bk h3 { margin: 0; font-size: 16px; font-weight: 800; }
.bk p { margin: 0; font-size: 13px; color: var(--ink-soft); }
.bk .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.bk.cancelled { opacity: .72; }
.empty { text-align: center; padding: 28px 12px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.empty .a { width: 110px; height: 110px; }
.empty h3 { margin: 0; font-size: 19px; font-weight: 800; }
.empty p { margin: 0; color: var(--ink-soft); font-size: 14.5px; max-width: 28ch; }

/* bottom nav */
.nav { flex: none; display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 8px 12px 10px; background: var(--paper); border-top: 1.5px solid var(--pink-line); }
.nav button { border: 0; background: none; color: var(--ink-soft); min-height: 54px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 12.5px; font-weight: 700; }
.nav button[aria-current="page"] { background: var(--pink); color: var(--ink); }
 /* modal and toast */
#modal { position: absolute; top: 0; right: 0; bottom: 0; left: 0; z-index: 30; background: rgba(107, 29, 63, .45); display: none; align-items: flex-end; justify-content: center; padding: 16px; }
#modal.open { display: flex; }
.sheet { width: 100%; background: var(--paper); border-radius: 26px; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 10px; animation: fade .2s ease; }
.sheet h2 { margin: 0; font-size: 20px; font-weight: 800; }
.sheet p { margin: 0 0 6px; color: var(--ink-soft); font-size: 15px; }
#toast { position: absolute; z-index: 40; left: 16px; right: 16px; bottom: 96px; display: flex; justify-content: center; pointer-events: none; }
#toast div { background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 999px; font-size: 14.5px; font-weight: 700; box-shadow: 0 8px 24px rgba(107,29,63,.3); animation: fade .2s ease; max-width: 100%; text-align: center; }
.paw-deco { position: absolute; color: var(--pink-line); opacity: .7; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
@media (max-height: 640px) {
  .hero-art { height: 110px; }
  .hero-art .a { width: 84px; height: 84px; }
  .brand b { font-size: 32px; }
}
</style>

   cat: '<svg class="a" viewBox="0 0 100 100" aria-hidden="true"><path d="M17 44 22 10 47 28Z" fill="#9A9AA8"/><path d="M83 44 78 10 53 28Z" fill="#9A9AA8"/><path d="M25 33 27 19 39 28Z" fill="#F6B8C8"/><path d="M75 33 73 19 61 28Z" fill="#F6B8C8"/><ellipse cx="50" cy="57" rx="34" ry="30" fill="#B7B7C3"/><path d="M50 28v9M42 29l2 8M58 29l-2 8" stroke="#8E8E9C" stroke-width="3" stroke-linecap="round"/><ellipse cx="50" cy="68" rx="17" ry="12" fill="#fff"/><ellipse cx="36" cy="54" rx="4.4" ry="5.4" fill="#3B3347"/><ellipse cx="64" cy="54" rx="4.4" ry="5.4" fill="#3B3347"/><circle cx="37.4" cy="52" r="1.5" fill="#fff"/><circle cx="65.4" cy="52" r="1.5" fill="#fff"/><path d="M46 62h8l-4 4.5z" fill="#F08AA6"/><path d="M50 66.5c-2 5-8 4-10 1M50 66.5c2 5 8 4 10 1" stroke="#3B3347" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M24 62h-12M24 67l-11 4M76 62h12M76 67l11 4" stroke="#8E8E9C" stroke-width="1.8" stroke-linecap="round"/><circle cx="27" cy="64" r="5" fill="#F7A5B5" opacity=".55"/><circle cx="73" cy="64" r="5" fill="#F7A5B5" opacity=".55"/></svg>',
    rabbit: '<svg class="a" viewBox="0 0 100 100" aria-hidden="true"><ellipse cx="36" cy="26" rx="9.5" ry="23" fill="#fff" stroke="#E4CBD5" stroke-width="2"/><ellipse cx="64" cy="26" rx="9.5" ry="23" fill="#fff" stroke="#E4CBD5" stroke-width="2" transform="rotate(8 64 26)"/><ellipse cx="36" cy="28" rx="4.5" ry="15" fill="#F8C6D4"/><ellipse cx="64.5" cy="28" rx="4.5" ry="15" fill="#F8C6D4" transform="rotate(8 64 28)"/><circle cx="50" cy="64" r="29" fill="#fff" stroke="#E4CBD5" stroke-width="2"/><circle cx="38" cy="60" r="4" fill="#4A3340"/><circle cx="62" cy="60" r="4" fill="#4A3340"/><circle cx="39.3" cy="58.6" r="1.4" fill="#fff"/><circle cx="63.3" cy="58.6" r="1.4" fill="#fff"/><circle cx="29" cy="71" r="5" fill="#F7A5B5" opacity=".55"/><circle cx="71" cy="71" r="5" fill="#F7A5B5" opacity=".55"/><path d="M46 68h8l-4 4z" fill="#F08AA6"/><path d="M50 72c-2 5-7 4-9 1M50 72c2 5 7 4 9 1" stroke="#4A3340" stroke-width="2" fill="none" stroke-linecap="round"/></svg>',
    bird: '<svg class="a" viewBox="0 0 100 100" aria-hidden="true"><path d="M32 78 16 96l26-6z" fill="#4FA3D9"/><ellipse cx="52" cy="56" rx="30" ry="33" fill="#8ACB6F"/><ellipse cx="57" cy="68" rx="18" ry="20" fill="#F7E58B"/><path d="M46 26c-3-12 7-16 14-12-5 2-5 7-4 13z" fill="#5FAE53"/><circle cx="42" cy="42" r="5" fill="#2F3A2A"/><circle cx="43.6" cy="40.4" r="1.6" fill="#fff"/><circle cx="33" cy="52" r="5" fill="#F7A5B5" opacity=".6"/><path d="M26 46 10 52l17 6z" fill="#F4A140"/><path d="M62 48q24 4 17 32-20-4-17-32z" fill="#5FAE53"/><path d="M44 88v6M56 88v6" stroke="#F4A140" stroke-width="3" stroke-linecap="round"/></svg>'
  };

    { id: 'dog', ar: 'كلب', tint: 't-lav' },

  function avatar(bg, hair, longHair) {

      (longHair ? '<path d="M19 30c-2-15 6-19 13-19s15 4 13 19v15H19z" fill="' + hair + '"/>' : '') +
      '<path d="M10 64c0-14 10-20 22-20s22 6 22 20z" fill="#fff"/><path d="M26 44l6 11 6-11z" fill="#DDE9F5"/>' +
      '<circle cx="32" cy="29" r="10" fill="#F3C9A5"/>' +

      '<path d="M22 46v5a6 6 0 0 0 12 0" stroke="#6B1D3F" stroke-width="2" fill="none" stroke-linecap="round"/></svg>';

 var VETS = [

  var SLOTS = [

  /* ---------- storage ---------- */
  function defaults() {
    return { users: { demo: { name: 'مستخدم تجريبي', pass: '1234' } }, session: null, bookings: [], draft: {} };
  }
  var db = defaults();
  (function loadDb() {
    try {
      var raw = localStorage.getItem(KEY);
      if (!raw) return;
      var d = JSON.parse(raw);
      if (d && typeof d === 'object') {
        if (d.users && typeof d.users === 'object') {
          var cleanUsers = {};
          Object.keys(d.users).forEach(function (k) {
            var r = d.users[k];
            if (r && typeof r.name === 'string' && typeof r.pass === 'string') cleanUsers[k] = r;
          });
          db.users = cleanUsers;
        }
        if (!db.users.demo) db.users.demo = defaults().users.demo;
        db.session = d.session && db.users[d.session] ? d.session : null;
        db.bookings = Array.isArray(d.bookings) ? d.bookings.filter(function (b) {
          return b && typeof b === 'object' && PET[b.pet] && b.id && typeof b.date === 'string' && slotById(b.time) && b.vetName && typeof b.price === 'number' && (b.status === 'active' || b.status === 'cancelled');
        }) : [];
        db.draft = d.draft && typeof d.draft === 'object' && !Array.isArray(d.draft) ? d.draft : {};
      }
    } catch (e) { /* storage unavailable: keep in-memory state */ }
  })();
  function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { /* ignore */ } }

  /* ---------- dates ---------- */
  function two(n) { return (n < 10 ? '0' : '') + n; }
  function keyOf(d) { return d.getFullYear() + '-' + two(d.getMonth() + 1) + '-' + two(d.getDate()); }
  function fromKey(k) { var p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(d, n) { var x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + n); return x; }
  function fmt(d, o) { try { return d.toLocaleDateString(AR, o); } catch (e) { return keyOf(d); } }
  function longDate(k) { return fmt(fromKey(k), { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); }
  function shortDate(k) { return fmt(fromKey(k), { weekday: 'long', day: 'numeric', month: 'long' }); }
  function todayKey() { return keyOf(new Date()); }
  function upcomingDays() {
    var t = new Date(), out = [];
    for (var i = 0; i < 8; i++) out.push(addDays(t, i));
    return out;
  }
  function hash(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

  /* A slot is unavailable when it has passed, is taken in the sample schedule, or is already booked here. */
  function slotState(dateKey, slotId, vetId) {
    var s = slotById(slotId), now = new Date();
    if (dateKey < todayKey()) return 'past';
   if (dateKey === todayKey() && s.h * 60 <= now.getHours() * 60 + now.getMinutes()) return 'past';
    if (hash(dateKey + '|' + vetId + '|' + slotId) % 4 === 0) return 'taken';
    var clash = db.bookings.some(function (b) { return b.status === 'active' && b.vet === vetId && b.date === dateKey && b.time === slotId; });
    return clash ? 'taken' : 'free';
  }

  /* ---------- state ---------- */
  var route = 'login', params = {}, bFilter = 'all';
  function me() { return db.session ? db.users[db.session] : null; }
  function myBookings() { return db.bookings.filter(function (b) { return b.user === db.session; }); }
  function draft() { return db.draft; }
  function resetDraft() { db.draft = {}; save(); }

    }
    return h;
  }

    }).join('') + '</nav>';
  }
  function demoNote(t) { return '<div class="note">' + icon('info', 18) + '<span>' + t + '</span></div>'; }

  function vLogin() {
    return '<main><div class="stack">' +

      '<form data-form="login" class="stack" novalidate>' +
      '<div class="field"><span class="lead">' + icon('user', 20) + '</span><input id="username" name="username" type="text" dir="auto" autocomplete="username" autocapitalize="none" placeholder="اسم المستخدم" aria-label="اسم المستخدم"></div>' +
      '<div class="field has-trail"><span class="lead">' + icon('lock', 20) + '</span><input id="password" name="password" type="password" dir="auto" autocomplete="current-password" placeholder="كلمة المرور" aria-label="كلمة المرور"><button type="button" class="trail" data-act="togglePw" aria-label="إظهار كلمة المرور">' + icon('eye', 20) + '</button></div>' +

      '</div></main>';
  }
 function vRegister() {
    return top('إنشاء حساب') + '<main><div class="stack">' +

  function onSubmit(f) {
    var kind = f.dataset.form, g = function (n) { return f.elements[n].value; };
    if (kind === 'login') {
      var u = g('username').trim().toLowerCase(), p = g('password');
      if (!u || !p) return setMsg('يرجى إدخال اسم المستخدم وكلمة المرور');
      var rec = db.users[u];
     if (!rec) return setMsg('اسم المستخدم غير موجود. أنشئ حساباً جديداً');
      if (rec.pass !== p) return setMsg('كلمة المرور غير صحيحة');
      login(u, rec.name);
    } else if (kind === 'register') {
      var nm = g('name').trim(), un = g('username').trim().toLowerCase(), pw = g('password'), cf = g('confirm');
      if (!nm  !un  !pw || !cf) return setMsg('يرجى تعبئة جميع الحقول');
      if (un.length < 3) return setMsg('اسم المستخدم يجب أن يكون ٣ أحرف على الأقل');
      if (/[\s<>"'&\\\/]/.test(un)) return setMsg('اسم المستخدم لا يقبل المسافات ولا الرموز < > " \' & \\ /');
      if (pw.length < 4) return setMsg('كلمة المرور يجب أن تكون ٤ أحرف على الأقل');
      if (pw !== cf) return setMsg('كلمتا المرور غير متطابقتين');
      if (db.users[un]) return setMsg('اسم المستخدم مستخدم من قبل، اختر اسماً آخر');
      db.users[un] = { name: nm, pass: pw };
      login(un, nm);
    }
  }

  function act(a, ds, el) {
    var d = draft();
    switch (a) {
      case 'back': go(BACK[route] || 'home'); break;
      case 'go': go(ds.to); break;
      case 'togglePw':
        var inp = el.parentNode.querySelector('input'), show = inp.type === 'password';
        inp.type = show ? 'text' : 'password';
        el.innerHTML = icon(show ? 'eyeOff' : 'eye', 20);
        el.setAttribute('aria-label', show ? 'إخفاء كلمة المرور' : 'إظهار كلمة المرور');
        break;
      case 'fillDemo': $('#username').value = 'demo'; $('#password').value = '1234'; setMsg(''); break;
      case 'startBooking': resetDraft(); go('pet'); break;
      case 'pickPet': d.pet = ds.id; save(); setMsg(''); render(); break;
      case 'pickVet': d.vet = ds.id; if (d.time && d.date && slotState(d.date, d.time, d.vet) !== 'free') d.time = null; save(); render(); break;
      case 'pickDate': d.date = ds.id; if (d.time && slotState(d.date, d.time, d.vet) !== 'free') d.time = null; save(); render(); break;
      case 'pickTime': d.time = ds.id; save(); setMsg(''); render(); break;
      case 'nextPet': if (!PET[d.pet]) return setMsg('يرجى اختيار نوع الحيوان للمتابعة'); go('vet'); break;
      case 'nextVet': if (!vetById(d.vet)) return setMsg('يرجى اختيار الطبيب للمتابعة'); go('time'); break;
      case 'nextTime':
        if (!d.date) return setMsg('يرجى اختيار تاريخ الموعد');
        if (d.date < todayKey()) return setMsg('لا يمكن حجز موعد في تاريخ سابق');
        if (!d.time) return setMsg('يرجى اختيار وقت الموعد');
        if (slotState(d.date, d.time, d.vet) !== 'free') return setMsg('هذا الموعد لم يعد متاحاً، اختر وقتاً آخر');
        go('summary'); break;
      case 'confirm':
        var err = validateDraft();
        if (err) { toast(err[1]); return go(err[0]); }
        var v = vetById(d.vet), s = slotById(d.time);
        var b = { id: newRef(), user: db.session, pet: d.pet, vet: v.id, vetName: v.name, clinic: v.clinic, date: d.date, time: s.id, timeLabel: s.label, price: PRICE, status: 'active', createdAt: Date.now() };
        db.bookings.push(b); db.draft = {}; save();
        go('done', { id: b.id }); break;
      case 'openBooking': go('detail', { id: ds.id }); break;
      case 'filter': bFilter = ds.id; render(); break;
      case 'cancelAsk':
        modal({ title: 'إلغاء الحجز؟', body: 'سيتم إلغاء الحجز رقم ' + ds.id + ' ويصبح الموعد متاحاً من جديد.', ok: 'نعم، إلغاء الحجز', no: 'تراجع', danger: true, onOk: function () {
          db.bookings.forEach(function (x) { if (x.id === ds.id) x.status = 'cancelled'; });
          save(); toast('تم إلغاء الحجز'); render();
        } }); break;
      case 'logout': db.session = null; db.draft = {}; save(); toast('تم تسجيل الخروج'); go('login'); break;
      case 'resetAsk':
        modal({ title: 'إعادة ضبط بيانات العرض؟', body: 'سيتم حذف جميع الحسابات والحجوزات المحفوظة على هذا الجهاز، وسيُعاد الحساب التجريبي فقط.', ok: 'نعم، احذف كل شيء', no: 'تراجع', danger: true, onOk: function () {
          db = defaults(); bFilter = 'all'; save(); toast('تمت إعادة ضبط البيانات'); go('login');
        } }); break;
    }
  }
   /* ---------- events ---------- */
  var shell = $('#shell');
  shell.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    try { act(el.dataset.act, el.dataset, el); } catch (err) { if (window.console) console.error(err); toast('حدث خطأ غير متوقع، حاول مرة أخرى'); }
  });
  shell.addEventListener('submit', function (e) {
    e.preventDefault();
    try { onSubmit(e.target); } catch (err) { if (window.console) console.error(err); setMsg('حدث خطأ غير متوقع، حاول مرة أخرى'); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeModal(); });
  $('#modal').addEventListener('click', function (e) { if (e.target.id === 'modal') closeModal(); });

  /* ---------- boot ---------- */
  document.documentElement.lang = 'ar';
  document.documentElement.dir = 'rtl';
  var tile = '<svg xmlns="http://www.w3.org/2000/svg" width="140" height="140" viewBox="0 0 140 140"><g fill="#F7D3DD" opacity=".55"><g transform="translate(16 18) rotate(-18) scale(.28)"><path d="M50 54c-13 0-22 9-22 18 0 8 6 11 13 9 4-1 6-2 9-2s5 1 9 2c7 2 13-1 13-9 0-9-9-18-22-18z"/><ellipse cx="22" cy="44" rx="8.5" ry="11"/><ellipse cx="39" cy="26" rx="9" ry="12"/><ellipse cx="61" cy="26" rx="9" ry="12"/><ellipse cx="78" cy="44" rx="8.5" ry="11"/></g><g transform="translate(88 82) rotate(16) scale(.34)"><path d="M50 54c-13 0-22 9-22 18 0 8 6 11 13 9 4-1 6-2 9-2s5 1 9 2c7 2 13-1 13-9 0-9-9-18-22-18z"/><ellipse cx="22" cy="44" rx="8.5" ry="11"/><ellipse cx="39" cy="26" rx="9" ry="12"/><ellipse cx="61" cy="26" rx="9" ry="12"/><ellipse cx="78" cy="44" rx="8.5" ry="11"/></g></g></svg>';
  shell.style.backgroundImage = 'url("data:image/svg+xml,' + encodeURIComponent(tile) + '")';
  route = db.session ? 'home' : 'login';
  render();
  if ($('#screen') && $('#screen').children.length) window.__mpcReady = true;
})();
</script>
