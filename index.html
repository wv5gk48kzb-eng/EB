<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>EB Doc - دليلك للاهتمام بالبشرة الهشة</title>
    <style>
        * {
            box-sizing: border-box;
            border-radius: 0px; /* زوايا حادة تماماً كما طلبتِ */
            font-family: Tahoma, Arial, sans-serif;
        }
        body {
            background-color: #f0f8ff; /* خلفية هادئة تناسب التطبيق الطبي */
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border: 2px solid #008080; /* إطار تبرويز احترافي */
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0, 128, 128, 0.15);
        }
        h2 {
            color: #005b5b;
            text-align: center;
            margin-top: 0;
            font-size: 22px;
        }
        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #006666;
            font-size: 14px;
        }
        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            border: 1px solid #008080;
            background-color: #fff;
            font-size: 16px;
        }
        .btn-primary {
            background: linear-gradient(135deg, #002b3d 0%, #008080 100%);
            color: white;
            font-weight: bold;
            cursor: pointer;
            margin-top: 25px;
            border: none;
            transition: 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
        .btn-secondary {
            background-color: #fff;
            color: #008080;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            border: 1px solid #008080;
        }
        .btn-secondary:hover {
            background-color: #f4fcfc;
        }
        .app-content {
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container" id="loginCard">
    <h2>دليلك للاهتمام بالبشرة الهشة</h2>
    <p style="text-align: center; color: #666; font-size: 13px;">تطبيق يهتم باحتياجات أبطال البشرة الهشة EB</p>

    <label>اسم المستخدم أو البريد:</label>
    <input type="text" id="username" value="حلا وليد">

    <label>كلمة المرور:</label>
    <input type="password" id="password" value="12345">

    <button class="btn-primary" onclick="handleLogin()">تسجيل الدخول ←</button>
    <button class="btn-secondary" onclick="alert('جاري الانتقال لصفحة إنشاء حساب جديد...')">إإنشاء حساب جديد 👤+</button>
</div>

<div class="container app-content" id="mainApp">
    <h2>مرحباً بكِ يا حلا في عالم EB Doc</h2>
    <p style="color: #555; margin-top: 15px;">تم تسجيل الدخول بنجاح إلى دليلك الطبي المخصص.</p>
    <hr style="border: 0; border-top: 1px solid #ddd; margin: 20px 0;">
    
    <label>اختر القسم المناسب للعناية:</label>
    <button class="btn-primary" onclick="alert('قسم ترطيب وحماية الجلد')">💧 التوجيهات اليومية للترطيب</button>
    <button class="btn-primary" onclick="style='margin-top:10px;' ; alert('قسم الاستشارات الطبية السريعة')">📋 استشارة وتوثيق الحالة</button>
    
    <button class="btn-secondary" onclick="location.reload()" style="margin-top: 30px;">تسجيل الخروج</button>
</div>

<script>
    function handleLogin() {
        // إخفاء صفحة تسجيل الدخول وإظهار التطبيق الرئيسي مباشرة
        document.getElementById('loginCard').style.display = 'none';
        document.getElementById('mainApp').style.display = 'block';
    }
</script>

</body>
</html>
